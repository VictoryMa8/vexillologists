{% if countries %}
    {% for country in countries %}
        <a href="{% url 'country' country_name=country.name|slugify %}" class="country-card">
            <span class="country-card-name">
                {{ country.name }}
                {% if country.flag_image_url %}
                    <img class="country-card-flag" src="{{ country.flag_image_url }}" alt="Flag of {{ country.name }}" loading="lazy" decoding="async">
                {% else %}
                    <span class="country-card-emoji" aria-hidden="true">{{ country.flag_emoji }}</span>
                {% endif %}
            </span>
        </a>
    {% endfor %}
{% else %}
    <div class="country-empty">
        <span aria-hidden="true">🧭</span>
        <h3>No flags found</h3>
        <p>Try a broader search or reset the filters.</p>
    </div>
{% endif %}
