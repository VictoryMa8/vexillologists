{% extends 'base.html' %}

{% block title %}Sign Up - Vexillology Quiz{% endblock %}

{% block content %}
<main class="flex flex-col items-center justify-center px-4 py-8 gap-4 w-full">
    <h1 class="text-3xl font-bold">Sign Up</h1>
    <form method="post" class="flex flex-col gap-4 w-full max-w-md bg-base-200 p-6 rounded-lg">
        {% csrf_token %}
        {% include "components/form_fields.html" with form=form %}
        <div class="recaptcha-frame"><div class="g-recaptcha" data-sitekey="{{ recaptcha_site_key }}"></div></div>
        <button type="submit" class="btn btn-primary mt-4 w-full">Sign Up</button>
        <script src="https://www.google.com/recaptcha/api.js" async defer></script>
    </form>
    <p>Already have an account? <a href="{% url 'login' %}" class="link link-primary hover:text-primary/70 transition-colors">Log in</a></p>
</main>

{% endblock %}
